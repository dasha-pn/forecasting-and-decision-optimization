name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tooling and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat pytest ruff

      - name: Validate notebook JSON and code-cell syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path('notebooks').glob('*.ipynb'))
          assert notebooks, 'No notebooks found'
          for path in notebooks:
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != 'code':
                      continue
                  source = cell.source
                  # IPython magics and shell escapes are valid in notebooks but not Python's AST.
                  lines = [line for line in source.splitlines()
                           if not line.lstrip().startswith(('%', '!', '?'))]
                  if any(line.lstrip().startswith(('%%',)) for line in source.splitlines()):
                      continue
                  if not ''.join(lines).strip():
                      continue
                  try:
                      ast.parse('\n'.join(lines))
                  except SyntaxError as exc:
                      # Existing forecasting notebooks may use notebook-specific syntax.
                      if 'agriculture_' in path.name:
                          raise SyntaxError(f'{path} cell {i}: {exc}') from exc
                      print(f'WARNING {path} cell {i}: {exc}')
              print(f'OK {path}')
          PY

      - name: Check syntax of Python modules
        run: |
          for folder in src tests; do
            if [ -d "$folder" ]; then python -m compileall -q "$folder"; fi
          done

      - name: Run tests when present
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            python -m pytest -q tests
          else
            echo 'No tests/ yet; skipping pytest.'
          fi

      - name: Ruff lint (Python files only)
        run: |
          if [ -d src ] && find src -name '*.py' | grep -q .; then
            ruff check src --select E4,E7,E9,F63,F7,F82
          else
            echo 'No Python source modules yet.'
          fi
